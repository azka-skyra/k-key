<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Y-Key</title>
  <link rel="stylesheet" href="..\static\style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-header">
        <div class="login-icon">🔐</div>
        <div class="login-title">Login Y-Key</div>
        <div class="login-sub">Masuk untuk mengakses web portfolio & dashboard admin</div>
      </div>
      <form onsubmit="login(event)">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="form-input" placeholder="admin" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <div id="error-msg" style="display: none; background: #fee2e2; border: 1px solid #fecaca; color: #991b1b; padding: 0.75rem; border-radius: 12px; font-size: 0.75rem; margin-bottom: 1rem;"></div>
        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem;">Masuk</button>
      </form>
      <div class="login-creds">
        <strong>🔑 Demo credentials:</strong><br>
        Username: <code>admin</code> · Password: <code>admin123</code>
      </div>
    </div>
  </div>

  <script>
    // ===== Cek apakah udah login, kalau iya redirect ke next =====
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('/api/admin/check');
        if (res.ok) {
          const data = await res.json();
          if (data.authenticated) {
            const urlParams = new URLSearchParams(window.location.search);
            const nextUrl = urlParams.get('next') || '/admin';
            window.location.href = nextUrl;
          }
        }
      } catch (e) {
        // ignore - user belum login
      }
    });

    // ===== Handle login form submit =====
    async function login(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errMsg = document.getElementById('error-msg');
      const btn = document.getElementById('submit-btn');

      // Ambil next URL dari query param
      const urlParams = new URLSearchParams(window.location.search);
      const nextUrl = urlParams.get('next') || '/admin';

      errMsg.style.display = 'none';
      btn.textContent = 'Memproses...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, next: nextUrl }),
        });
        const data = await res.json();
        if (!res.ok) {
          errMsg.textContent = data.error || 'Login gagal';
          errMsg.style.display = 'block';
          btn.textContent = 'Masuk';
          btn.disabled = false;
          return;
        }
        btn.textContent = '✓ Berhasil! Mengalihkan...';
        // Redirect ke URL yang dituju (next)
        setTimeout(() => {
          window.location.href = data.next || nextUrl;
        }, 600);
      } catch (err) {
        errMsg.textContent = 'Gagal terhubung ke server';
        errMsg.style.display = 'block';
        btn.textContent = 'Masuk';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
